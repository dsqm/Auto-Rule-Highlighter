<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 480px; height: 383px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; color: #333; background: #fafafa; overflow: hidden; display: flex; flex-direction: column; position: relative; }
    .popup-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
    .header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: #fff; border-bottom: 1px solid #e8e8e8; flex-shrink: 0; }
    .header h1 { font-size: 15px; font-weight: 600; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .header-right .switch-label { font-size: 11px; color: #999; display: flex; align-items: center; gap: 4px; }
    .toggle { position: relative; width: 36px; height: 20px; cursor: pointer; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .slider { position: absolute; inset: 0; background: #ccc; border-radius: 10px; transition: 0.2s; }
    .toggle .slider::before { content: ''; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: 0.2s; }
    .toggle input:checked + .slider { background: #1890ff; }
    .toggle input:checked + .slider::before { transform: translateX(16px); }
    .search-box { padding: 12px 16px; background: #fff; border-bottom: 1px solid #e8e8e8; flex-shrink: 0; }
    .search-row { display: flex; gap: 6px; align-items: center; }
    .search-input-wrapper { position: relative; flex: 1; }
    .search-input-wrapper input[type="text"] { width: 100%; padding: 8px 30px 8px 10px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 13px; outline: none; }
    .search-input-wrapper input[type="text"]:focus { border-color: #1890ff; }
    .search-history-btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 11px; color: #bbb; padding: 2px; line-height: 1; }
    .search-history-btn:hover { color: #1890ff; }
    .btn { padding: 6px 12px; border: 1px solid #d9d9d9; border-radius: 4px; background: #fff; cursor: pointer; font-size: 12px; color: #333; transition: all 0.15s; white-space: nowrap; }
    .btn:hover { border-color: #1890ff; color: #1890ff; }
    .btn-primary { background: #1890ff; color: #fff; border-color: #1890ff; }
    .btn-primary:hover { background: #40a9ff; }
    .btn-danger { color: #ff4d4f; border-color: #ff4d4f; }
    .btn-danger:hover { background: #fff1f0; }
    .btn-sm { padding: 3px 8px; font-size: 11px; }
    .search-options { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
    .match-type-row { display: flex; gap: 4px; }
    .match-type-btn { font-size: 11px; padding: 3px 8px; border: 1px solid #d9d9d9; border-radius: 3px; background: #fafafa; color: #666; cursor: pointer; transition: all 0.15s; }
    .match-type-btn:hover { border-color: #1890ff; color: #1890ff; }
    .match-type-btn.active { background: #1890ff; color: #fff; border-color: #1890ff; }
    .toggle-options-row { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
    .toggle-opt-btn { font-size: 10px; padding: 3px 7px; border: 1px solid #e0e0e0; border-radius: 3px; background: #fafafa; color: #bbb; cursor: pointer; font-weight: 600; transition: all 0.15s; line-height: 1.4; }
    .toggle-opt-btn:hover { border-color: #1890ff; }
    .toggle-opt-btn.active { background: #e6f7ff; color: #1890ff; border-color: #91d5ff; }
    .toggle-opt-btn.across { font-size: 12px; padding: 3px 5px; }
    .color-preset-row { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
    .preset-dot { cursor: pointer; flex-shrink: 0; padding: 0; border: none; line-height: 0; transition: transform 0.1s, border-color 0.1s; }
    .preset-dot:hover { transform: scale(1.1); }
    .preset-dot.selected { box-shadow: 0 0 0 2px #1890ff; }
    .section { border-bottom: 1px solid #f0f0f0; }
    .section-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; background: #f9f9f9; font-size: 12px; color: #666; font-weight: 500; }
    .section-header .badge { background: #e6f7ff; color: #1890ff; font-size: 11px; padding: 2px 8px; border-radius: 8px; }
    .kw-list { padding: 6px 16px 10px; }
    .kw-item { display: flex; align-items: center; padding: 6px 0; gap: 6px; border-bottom: 1px solid #f5f5f5; font-size: 13px; }
    .kw-item:last-child { border-bottom: none; }
    .kw-preview { cursor: pointer; flex-shrink: 0; transition: transform 0.1s; }
    .kw-preview:hover { transform: scale(1.15); }
    .kw-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .kw-text.dim { color: #bbb; text-decoration: line-through; }
    .kw-type { font-size: 10px; color: #999; background: #f5f5f5; padding: 2px 6px; border-radius: 3px; flex-shrink: 0; }
    .kw-actions { display: flex; gap: 3px; align-items: center; flex-shrink: 0; }
    .kw-rule-name { font-size: 10px; color: #999; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; }
    .kw-exclusive-icon { font-size: 11px; margin-right: 3px; }
    .kw-item.kw-auto-hidden { opacity: 0.5; background: #f5f5f5; }
    .color-picker-popup { position: fixed; z-index: 99999; background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,0.12); padding: 12px; width: 300px; display: none; max-height: 320px; overflow-y: auto; }
    .color-picker-popup.show { display: block; }
    .cpp-title { font-size: 12px; font-weight: 500; color: #333; margin-bottom: 10px; }
    .se-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
    .se-row:last-child { margin-bottom: 0; }
    .se-label { width: 32px; font-size: 12px; color: #999; flex-shrink: 0; }
    .se-toggle { flex-shrink: 0; width: auto; margin: 0; }
    .se-row input[type="color"] { width: 24px; height: 24px; padding: 0; border: 1px solid #d9d9d9; border-radius: 3px; cursor: pointer; flex-shrink: 0; background: none; }
    .se-row input[type="color"]:disabled { opacity: 0.3; cursor: not-allowed; }
    .se-row input[type="text"] { flex: 1; min-width: 0; padding: 3px 6px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 12px; outline: none; font-family: monospace; }
    .se-row input[type="text"]:focus { border-color: #1890ff; }
    .se-row select { flex: 1; min-width: 0; padding: 3px 6px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 12px; outline: none; background: #fff; color: #333; }
    .se-row select:disabled, .se-row input[type="range"]:disabled { opacity: 0.4; cursor: not-allowed; }
    .se-row input[type="range"] { flex: 1; min-width: 0; }
    .se-fs-val { font-size: 12px; width: 34px; text-align: right; flex-shrink: 0; color: #666; }
    .se-chip { min-width: 26px; height: 22px; border: 1px solid #d9d9d9; border-radius: 4px; background: #fff; cursor: pointer; font-size: 12px; color: #666; line-height: 1; }
    .se-chip:hover { border-color: #1890ff; }
    .se-chip.on { background: #e6f7ff; color: #1890ff; border-color: #91d5ff; }
    .se-chip.b { font-weight: 700; }
    .se-chip.i { font-style: italic; }
    .se-chip.u { text-decoration: underline; }
    .se-chip.s { text-decoration: line-through; }
    .cpp-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 12px; position: sticky; bottom: -12px; background: #fff; padding: 6px 0; box-shadow: 0 -4px 8px -6px rgba(0,0,0,0.25); }
    .manual-clear-badge { display: flex; align-items: center; justify-content: flex-end; padding: 6px 16px; background: #fffbe6; border-top: 1px dashed #ffe58f; }
    .empty-hint { padding: 12px 16px; font-size: 12px; color: #bbb; text-align: center; }
    .footer { padding: 10px 16px; display: flex; gap: 8px; align-items: center; justify-content: space-between; background: #fff; border-top: 1px solid #e8e8e8; flex-shrink: 0; }
    .footer .btn { flex: 1; text-align: center; padding: 6px; font-size: 13px; }
    .history-dropdown { display: none; position: absolute; left: 16px; right: 16px; max-height: 260px; overflow-y: auto; background: #fff; border: 1px solid #e0e0e0; border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); z-index: 100; }
    .history-dropdown.show { display: block; }
    .history-dropdown .history-item { padding: 8px 12px; font-size: 12px; cursor: pointer; border-bottom: 1px solid #f5f5f5; display: flex; align-items: center; justify-content: space-between; transition: background 0.1s; }
    .history-dropdown .history-item:last-child { border-bottom: none; }
    .history-dropdown .history-item:hover, .history-dropdown .history-item.active { background: #e6f7ff; }
    .history-dropdown .history-item .hist-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-dropdown .history-item .hist-match { font-size: 10px; color: #999; margin-left: 6px; flex-shrink: 0; }
    .history-dropdown .history-footer { padding: 6px 12px; border-top: 1px solid #f0f0f0; text-align: center; }
    .history-dropdown .history-footer button { font-size: 11px; color: #ff4d4f; background: none; border: none; cursor: pointer; padding: 2px 6px; }
    .history-dropdown .history-footer button:hover { text-decoration: underline; }
    .history-dropdown .history-empty { padding: 12px; text-align: center; font-size: 11px; color: #bbb; }
    .hist-del { font-size: 10px; color: #ccc; cursor: pointer; padding: 0 3px; margin-left: auto; flex-shrink: 0; line-height: 1; border-radius: 2px; }
    .hist-del:hover { color: #ff4d4f; background: #fff1f0; }
    .hist-tag { font-size: 12px; font-weight: 600; margin-left: 4px; flex-shrink: 0; }
    .hist-tag.hist-case { color: #fa8c16; }
    .hist-tag.hist-across { color: #1890ff; }
    .kw-nav-btn { font-size: 11px; cursor: pointer; padding: 0 4px; line-height: 1; border: 1px solid #e8e8e8; border-radius: 3px; background: #fafafa; flex-shrink: 0; transition: all 0.15s; }
    .kw-nav-btn:hover { border-color: #1890ff; color: #1890ff; background: #f0f7ff; }
    .kw-nav-btn:disabled { opacity: 0.5; cursor: not-allowed; border-color: #e8e8e8; color: #ccc; background: #f5f5f5; }
    .kw-nav-index { font-size: 10px; color: #666; min-width: 32px; text-align: center; line-height: 1.4; flex-shrink: 0; user-select: none; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Auto Rule Highlighter</h1>
    <div class="header-right">
      <span class="switch-label">右边栏 <label class="toggle"><input type="checkbox" id="railToggle" checked><span class="slider"></span></label></span>
      <span class="switch-label">当前页 <label class="toggle"><input type="checkbox" id="pageToggle" checked><span class="slider"></span></label></span>
    </div>
  </div>

  <div class="search-box">
    <div class="search-row">
      <div class="search-input-wrapper">
        <input type="text" id="searchInput" placeholder="输入关键词临时高亮..." autofocus>
        <button class="search-history-btn" id="btnHistory" title="历史记录">▼</button>
      </div>
      <button class="btn btn-primary" id="btnSearch">+</button>
    </div>

    <div class="search-options">
      <div class="match-type-row">
        <button class="match-type-btn active" data-match-type="contains">包含</button>
        <button class="match-type-btn" data-match-type="exact">精确</button>
        <button class="match-type-btn" data-match-type="regex">正则</button>
        <button class="match-type-btn" data-match-type="wildcard">通配</button>
        <span style="color:#d0d0d0;font-size:18px;line-height:1;flex-shrink:0;margin-left:2px;">│</span>
        <button class="toggle-opt-btn" id="searchCaseSensitive" title="区分大小写">Aa</button>
        <button class="toggle-opt-btn across" id="searchAcrossElements" title="跨元素匹配">↔</button>
      </div>
      <div class="toggle-options-row">
        <span id="searchStylePreview" title="当前临时高亮样式，点击编辑"></span>
        <div class="color-preset-row" id="searchColorPresets"></div>
      </div>
    </div>
  </div>

  <div class="popup-scroll">
  <div class="section" id="tempSection" style="display:none;">
    <div class="section-header"><span>临时高亮</span><span class="badge" id="tempCount">0</span></div>
    <div class="kw-list" id="tempList"></div>
  </div>

  <div class="section" id="spotSection" style="display:none;">
    <div class="section-header"><span>高亮此处</span><span class="badge" id="spotCount">0</span></div>
    <div class="kw-list" id="spotList"></div>
  </div>

  <div class="section" id="ruleSection" style="display:none;">
    <div class="section-header"><span>自动规则</span><span class="badge" id="ruleCount">0</span></div>
    <div class="kw-list" id="ruleList"></div>
  </div>

  <div id="emptyHint" class="empty-hint">暂无高亮，输入关键词开始</div>
  </div>

  <div class="footer">
    <button class="btn" id="btnManageRules">管理规则</button>
  </div>

  <div class="history-dropdown" id="historyDropdown"></div>

  <div class="color-picker-popup" id="colorPickerPopup">
    <div class="cpp-title">自定义样式</div>
    <div id="cppStyleBody"></div>
    <div class="cpp-actions">
      <button class="btn btn-sm" id="cppCancel">取消</button>
      <button class="btn btn-sm btn-primary" id="cppApply">应用</button>
    </div>
  </div>

  <script src="../utils/matcher.js"></script>
  <script src="../utils/storage.js"></script>
  <script src="../utils/style.js"></script>
  <script src="../utils/style-editor.js"></script>
  <script src="popup.js"></script>
</body>
</html>
