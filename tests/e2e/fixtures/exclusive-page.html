<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>E2E 独占高亮测试页</title>
</head>
<body>
  <h1>独占高亮测试页</h1>
  <!-- 普通词全部位于页面顶部（先出现），独占词在下方（后出现）。
       用于验证：规则顺序中独占在前时，即使其后的普通词在页面中先出现，仍会被清除 -->
  <p>普通词 出现在此页面最顶部，先于 独占词 出现。</p>
  <p>普通词 第二处。</p>
  <p><span>普通词</span> 嵌套第三处。</p>
  <p>独占词 出现在下方段落。</p>
  <p>独占词 第二处。</p>
</body>
</html>
