name: Test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 单元测试 + 端到端测试
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          # 无 package-lock.json（本地不安装依赖），禁用 cache: npm，否则 setup-node 因找不到 lock 文件报错
          node-version: 24

      - name: 安装依赖（vitest / puppeteer）
        # 仓库未提交 package-lock.json，用 npm install（首次运行会生成）；
        # 若后续提交 lock 文件可改回 npm ci 锁定版本
        run: npm install --no-audit --no-fund

      - name: 安装 Chromium 及系统依赖
        run: |
          npx puppeteer browsers install chrome
          sudo npx puppeteer browsers install chrome --with-deps || sudo apt-get update && sudo apt-get install -y \
            libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 libpango-1.0-0 libcairo2

      - name: 单元测试（utils 纯逻辑）
        run: npm test

      - name: 端到端测试（加载扩展 + 真实页面高亮）
        run: npm run test:e2e