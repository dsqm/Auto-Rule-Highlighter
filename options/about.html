<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; color: #333; background: #f5f5f5; min-height: 100vh; }
    .container { max-width: 600px; margin: 0 auto; padding: 40px 20px; }
    .card { background: #fff; border-radius: 8px; padding: 30px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    h1 { font-size: 24px; margin-bottom: 6px; }
    .version { font-size: 13px; color: #999; margin-bottom: 20px; }
    p { line-height: 1.8; margin: 8px 0; color: #555; }
    a { color: #1890ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    hr { border: none; border-top: 1px solid #f0f0f0; margin: 20px 0; }
    .support { background: #fff7e6; border: 1px solid #ffe0a3; border-radius: 6px; padding: 14px 16px; margin: 16px 0; }
    .support .support-title { font-size: 14px; font-weight: 600; color: #ad6800; margin-bottom: 6px; }
    .support p { margin: 4px 0; color: #7a5c1e; font-size: 13px; }
    .support a { color: #d46b08; font-weight: 600; }
    .support a:hover { text-decoration: underline; }
    .footer-links { margin-top: 16px; text-align: center; font-size: 13px; color: #999; }
    .footer-links a { margin: 0 8px; }
    .footer-links .sep { color: #ddd; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1 id="ext-name">Auto Rule Highlighter</h1>
      <div class="version">v<span id="ext-version">1.2.0</span> &mdash; GPL v3</div>
      <p>根据自定义规则自动高亮网页关键字，支持正则、通配符等多种匹配方式。</p>

      <p>欢迎提交 Issue 或 Pull Request 来帮助改进这个项目。</p>

      <hr>

      <div class="support">
        <div class="support-title">☕ 捐赠或支持开发者</div>
        <p>如果这个扩展对你有帮助，欢迎请作者喝杯咖啡，你的支持是持续改进的动力。</p>
        <p><a href="https://docs.qq.com/aio/DRWtMY3FQS0ZHRGRG?p=qIniwAv5QQjaAipgIvwLF5" target="_blank" rel="noopener">前往捐赠 / 支持页面 →</a></p>
      </div>

      <hr>

      <p><a href="https://github.com/dsqm/Auto-Rule-Highlighter" target="_blank">GitHub 仓库</a></p>
      <p><a href="https://github.com/dsqm/Auto-Rule-Highlighter/issues" target="_blank">提交 Issue</a></p>
      <p>Icons by <a href="https://icons8.com" target="_blank">Icons8</a>.</p>
    </div>

    <div class="footer-links">
      <a href="options.html">设置</a>
      <span class="sep">|</span>
      <a href="about.html">关于</a>
    </div>
  </div>
  <script src="about.js"></script>
</body>
</html>
